<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <section class="hero-section">
      <div class="header">
        <img src="/image/netflix-logo.svg" alt="" />
        <button>Sign in</button>
      </div>
      <div class="hero-content">
        <h1 class="main-heading">Unlimited movies, TV shows, and more</h1>
        <h3 class="secondary-heading">
          Plans start at ₦2,500. Cancel anytime.
        </h3>
        <p class="description">
          Ready to watch? Enter your email to start your membership.
        </p>
        <div class="form">
          <input
            class="email_input"
            id="email"
            type="email"
            placeholder="Email Address"
          />
          <!-- <select name="" id="">
            <option value="" selected disabled>select your gender</option>
            <option value="">Male</option>
            <option value="">Female</option>
          </select> -->
          <button>Try 7 days for ₦0</button>
        </div>
        <small>New members only. Terms below.</small>
      </div>
    </section>
  </body>
</html>
